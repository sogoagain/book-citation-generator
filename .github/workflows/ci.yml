name: CI

on:
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '20'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: |
          cd ${{ matrix.project }}
          npm ci

      - name: Run linting
        run: |
          cd ${{ matrix.project }}
          npm run lint

      - name: Check Prettier formatting
        run: |
          cd ${{ matrix.project }}
          npm run format:check

      - name: Run tests
        run: |
          cd ${{ matrix.project }}
          npm test
